<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>SMART POS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020817;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }

  /* Animated background */
  .bg-gradient {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(59,130,246,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 10% 70%, rgba(16,185,129,0.08) 0%, transparent 50%);
    animation: bgPulse 4s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    from { opacity: 0.7; }
    to   { opacity: 1; }
  }

  /* Grid pattern */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Logo ring */
  .logo-ring {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 28px;
  }

  .logo-ring svg.spinner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: spin 2.5s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .logo-inner {
    position: absolute;
    inset: 10px;
    background: linear-gradient(135deg, #1e3a5f 0%, #0f1f3a 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 30px rgba(59,130,246,0.3),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .logo-text-inner {
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }

  /* Brand name */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 40px;
  }

  .brand-name {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand-name span {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand-sub {
    font-size: 12px;
    letter-spacing: 4px;
    color: #475569;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Progress bar */
  .progress-wrap {
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  .progress-bar-bg {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 99px;
    transition: width 0.3s ease;
    box-shadow: 0 0 8px rgba(59,130,246,0.6);
  }

  .status-text {
    font-size: 12px;
    color: #475569;
    letter-spacing: 0.5px;
    min-height: 18px;
    transition: opacity 0.3s;
  }

  /* Version badge */
  .version {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-size: 11px;
    color: #1e293b;
    letter-spacing: 0.5px;
  }

  /* Agent badge */
  .agent-badge {
    position: fixed;
    bottom: 20px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #334155;
  }

  .agent-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34,197,94,0.6);
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Fade in animation */
  .container {
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="bg-grid"></div>

<div class="container">
  <!-- Logo with spinning ring -->
  <div class="logo-ring">
    <!-- Spinning dashed ring -->
    <svg class="spinner" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="54"
        stroke="url(#ringGrad)"
        stroke-width="2"
        stroke-dasharray="80 260"
        stroke-linecap="round"/>
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="logo-inner">
      <span class="logo-text-inner">SP</span>
    </div>
  </div>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-name">SMART <span>POS</span></div>
    <div class="brand-sub">Kassa Tizimi</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusText">Ishga tushirilmoqda...</div>
  </div>
</div>

<div class="agent-badge">
  <div class="agent-dot"></div>
  <span>Print Agent faol</span>
</div>

<div class="version">v1.0.0</div>

<script>
  const steps = [
    { pct: 20,  text: 'Sozlamalar yuklanmoqda...' },
    { pct: 45,  text: 'Print Agent ishga tushirilmoqda...' },
    { pct: 70,  text: 'Printerlar sinxronlanmoqda...' },
    { pct: 90,  text: 'Kassa oynasi tayyorlanmoqda...' },
    { pct: 100, text: 'Tayyor!' },
  ];

  const fill = document.getElementById('progressFill');
  const statusText = document.getElementById('statusText');

  let i = 0;
  const interval = setInterval(() => {
    if (i >= steps.length) {
      clearInterval(interval);
      return;
    }
    fill.style.width = steps[i].pct + '%';
    statusText.textContent = steps[i].text;
    i++;
  }, 380);
</script>

</body>
</html>
